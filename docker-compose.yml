services:
  postgres:
    image: postgres:16
    container_name: seatsync-postgres
    environment:
      POSTGRES_USER: seatsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: seatsync
    ports:
      - "5432:5432"
    volumes:
      - seatsync-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seatsync-redis
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: seatsync-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: seatsync
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: SeatSync.Api/Dockerfile
    container_name: seatsync-api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=seatsync;Username=seatsync;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "seatsync"
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__Issuer: "SeatSync"
      Jwt__Audience: "SeatSyncClient"
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__ExpiryMinutes: "60"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/seatsync-web
    container_name: seatsync-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  seatsync-pgdata: