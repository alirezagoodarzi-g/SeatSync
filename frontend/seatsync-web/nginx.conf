server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path that isn't a real file falls back to index.html,
    # so Vue Router's client-side routes (e.g. /events/abc) work on a hard
    # refresh instead of Nginx 404-ing them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}